<!doctype html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Mängud</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>
    <div id="app" class="page">

        <div class="headline">
            <h1>Siin saab uendada mängude andmeid</h1>
            <p>Muutmiseks vajuta “Edit”, tee muudatused ja kinnita “Save”.</p>
        </div>

        <div class="table-wrap">
            <div class="scroll-x">
                <table id="gamesTable">
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>

                    <tr v-for="game in games" :key="game.id ?? game._id">
                        <template v-if="editId !== (game.id ?? game._id)">
                            <td @click="getGame(game.id ?? game._id)">{{ game.name }}</td>
                            <td>{{ game.price }}</td>
                            <td>{{ game.type }}</td>
                            <td>
                                <button class="btn-ghost" @click="startEdit(game)">Edit</button>
                            </td>
                        </template>

                        <template v-else>
                            <td><input type="text" v-model="editBuffer.name"></td>
                            <td><input type="number" v-model.number="editBuffer.price"></td>
                            <td><input type="text" v-model="editBuffer.type"></td>
                            <td style="display:flex; gap:8px;">
                                <button class="btn-primary" @click="saveEdit()">Save</button>
                                <button class="btn-secondary" @click="cancelEdit()">Cancel</button>
                            </td>
                        </template>
                    </tr>
                </table>
            </div>
        </div>

        <p class="error" v-if="error">{{ error }}</p>

        <div id="gameInfoModal" class="modal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Game Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <table class="table">
                            <tr>
                                <th>ID</th>
                                <td>{{ gameInModal.id ?? gameInModal._id }}</td>
                            </tr>
                            <tr>
                                <th>Name</th>
                                <td>{{ gameInModal.name }}</td>
                            </tr>
                            <tr>
                                <th>Price</th>
                                <td>{{ gameInModal.price }}</td>
                            </tr>
                            <tr>
                                <th>Type</th>
                                <td>{{ gameInModal.type }}</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="rest-client.js"></script>
</body>

</html>
